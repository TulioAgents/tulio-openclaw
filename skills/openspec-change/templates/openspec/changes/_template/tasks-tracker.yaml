# tasks-tracker.yaml — fast status index for all tasks in this change
# Agents: update this file atomically whenever you change a task's status, assignee, or other fields.
# The gateway reads this file for the kanban board instead of parsing every individual task file.
changeId: ""
updatedAt: ""
tasks: []
